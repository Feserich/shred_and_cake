[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skibasar"
version = "0.1.0"
description = "Offline web application for the ski club's Ski Basar"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "segno>=1.6",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]
build = ["pyinstaller>=6"]

[project.scripts]
skibasar = "skibasar.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skibasar = ["templates/**/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form"]
