name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: skibasar-linux.tar.gz
            archive: tar -czf skibasar-linux.tar.gz -C dist skibasar -C "$PWD/docs" Anleitung.md
          - os: windows-latest
            artifact: skibasar-windows.zip
            archive: Compress-Archive -Path dist/skibasar.exe, dist/Skibasar-starten.bat, dist/Skibasar-mit-Telefonen.bat, docs/Anleitung.md -DestinationPath skibasar-windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require tagged commit to be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
        shell: bash
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: ./packaging/build.sh
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: ./packaging/build.ps1
        shell: pwsh
      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: ${{ matrix.archive }}
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        run: ${{ matrix.archive }}
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
