<form method="post" action="{{ action }}">
  <label>Name <input name="name" value="{{ f.name }}" required></label>
  <label>Vorname <input name="first_name" value="{{ f.first_name }}"></label>
  <label>Telefon <input name="phone" value="{{ f.phone }}"></label>
  <label>E-Mail <input name="email" value="{{ f.email }}"></label>
  <label>Adresse <input name="address" value="{{ f.address }}"></label>
  <label><input type="checkbox" name="fee_exempt" {{ "checked" if f.fee_exempt }}> Keine Angebotsgebühr (Lehrteam / Basarhelfer) – Provision wird trotzdem berechnet</label>
  <label>Notizen <textarea name="notes">{{ f.notes }}</textarea></label>
  <button type="submit">{{ button }}</button>
</form>
