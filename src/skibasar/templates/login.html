{% extends "base.html" %}
{% block title %}Anmelden – Skibasar{% endblock %}
{% block content %}
<h1>Anmelden</h1>
<p class="hint">Bitte die PIN eingeben, die am Hauptrechner unter „Telefon“ angezeigt wird.</p>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login">
  <label>PIN
    <input type="password" name="pin" inputmode="numeric" autocomplete="off" autofocus required>
  </label>
  <button type="submit">Anmelden</button>
</form>
{% endblock %}
